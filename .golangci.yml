# GolangCI-Lint v2 configuration file
# See https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m # tempo máximo de execução do linter
  tests: true # inclui testes na análise

formatters:
  enable:
    - goimports # formatação e organização de imports
    - gofmt # formatação padrão gofmt

  settings:
    goimports:
      local-prefixes:
        - github.com/jeanmolossi/verbose-adventure # prefixo de imports locais

linters:
  enable:
    - errcheck # verifica erros não tratados
    - staticcheck # análises estáticas avançadas
    - unused # variáveis não utilizadas
    - dupl # detecta duplicações de código
    - gocyclo # mede complexidade ciclomática
    - ineffassign
    - govet
    - canonicalheader
    - copyloopvar
    - gosec
    - importas
    - lll
    - misspell
    - nlreturn
    - prealloc
    - spancheck
    - sqlclosecheck
    - tagalign
    - testifylint
    - thelper
    - varnamelen
    - whitespace
    - wsl

  settings:
    gocyclo:
      min-complexity: 10 # limiar para complexidade
    dupl:
      threshold: 75 # tokens duplicados para alertar
    varnamelen:
      ignore-names:
        - err
        - db
        - ok
        - p
        - w
        - c
        - id
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
    wsl:
      allow-cuddle-declarations: true
      allow-cuddle-used-in-block: true
      force-err-cuddling: true
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (net/http.ResponseWriter).Write
    tagalign:
      sort: false
    nlreturn:
      block-size: 3

issues:
  max-issues-per-linter: 0 # ilimitado por linter
  max-same-issues: 0 # ilimitado de mesma issue

output:
  formats:
    text:
      colors: true # saída colorida com número de linhas

