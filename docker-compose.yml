services:
  mysql-master:
    container_name: mysql-master
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
      MYSQL_DATABASE: crmcore
    ports:
      - "33060:3306"
    restart: unless-stopped
    volumes:
      - "mysql_master_data:/var/lib/mysql"
      - .docker/mysql/master:/docker-entrypoint-initdb.d:ro
    command:
      [
        "--server-id=1",
        "--log-bin=mysql-bin",
        "--binlog-format=ROW",
        "--gtid-mode=ON",
        "--enforce-gtid-consistency",
        "--log-replica-updates",
        "--mysql-native-password=ON",
        "--sha256_password_auto_generate_rsa_keys=1",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mysql-replica:
    container_name: mysql-replica
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS}
    ports:
      - "33061:3306"
    restart: unless-stopped
    volumes:
      - "mysql_replica_data:/var/lib/mysql"
      - .docker/mysql/replica:/docker-entrypoint-initdb.d:ro
    command:
      [
        "--server-id=2",
        "--read-only=1",
        "--relay-log=relay-bin",
        "--gtid-mode=ON",
        "--enforce-gtid-consistency",
        "--mysql-native-password=ON",
      ]
    depends_on:
      - mysql-master
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASS}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # postgres:
  #   container_name: postgres
  #   image: postgres:17
  #   environment:
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_DB: crmcore
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - "pg_data:/var/lib/postgresql/data"

  api:
    container_name: api
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      - mysql-master
      - mysql-replica
      # - postgres
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: >
      sh -c "
        socat TCP-LISTEN:8080,fork,bind=127.0.0.1 TCP:host.docker.internal:8080 & reflex -c reflex.conf
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_master_data:
  mysql_replica_data:
  pg_data:
