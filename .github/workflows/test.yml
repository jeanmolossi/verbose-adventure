name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ubuntu:
    strategy:
      matrix:
        go: ["1.24", "1.23"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            **/go.sum

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test -timeout 10m ./...
